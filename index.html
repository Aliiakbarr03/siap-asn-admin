<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIAP ASN — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui;background:#07152c;color:#fff}.wrap{width:min(1100px,92%);margin:auto}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,100%);background:#10284a;padding:32px;border-radius:22px;border:1px solid #29496e}.brand{font-size:28px;font-weight:900}.brand span{color:#21d4fd}input{width:100%;padding:15px;margin:8px 0 14px;border-radius:10px;border:0;font-size:16px}button{border:0;border-radius:10px;padding:14px 18px;font-weight:800;cursor:pointer}.primary{background:#21a8f6;color:#fff;width:100%}.msg{min-height:24px;margin-top:12px;color:#ff9b9b}.top{padding:18px 0;background:#0b2145}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.logout{background:#203c5f;color:#fff}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:24px 0}.nav button{background:#163657;color:#fff}.page{background:#10284a;border:1px solid #29496e;border-radius:18px;padding:25px;min-height:300px}.hidden{display:none}
</style></head><body>
<div id="loginView" class="login"><div class="box"><div class="brand"><span>SIAP</span> ASN</div><h2>Admin Panel</h2><p style="color:#aec0d6">Masuk untuk mengelola aplikasi.</p><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button id="loginBtn" type="button" class="primary">Masuk Admin →</button><div id="msg" class="msg"></div></div></div>
<div id="appView" class="hidden"><div class="top"><div class="wrap row"><div class="brand"><span>SIAP</span> ASN ADMIN</div><div><span id="adminEmail"></span> <button id="logoutBtn" class="logout">Keluar</button></div></div></div><main class="wrap"><div class="nav"><button data-page="dashboard">Dashboard</button><button data-page="bank">Bank Soal</button><button data-page="tryout">Tryout</button><button data-page="materi">Materi</button><button data-page="banner">Banner</button></div><div id="page" class="page"></div></main></div>
<script>
const SUPABASE_URL='https://qinxnrcdsmxduhvrnzfh.supabase.co';
const SUPABASE_KEY='sb_publishable__o_Qj-DptS7XEcYyi9CrSQ_pY3E5RSX';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function showMessage(t){$('msg').textContent=t}
async function login(){
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||!password){showMessage('Email dan password wajib diisi.');return}
 const btn=$('loginBtn');btn.disabled=true;btn.textContent='Memproses...';
 try{
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)throw error;
  await openApp(data.user);
 }catch(e){showMessage(e.message||'Login gagal.')}
 finally{btn.disabled=false;btn.textContent='Masuk Admin →'}
}
function openApp(user){
 if(!user)return;
 $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');
 $('adminEmail').textContent=user.email||'Admin';showPage('dashboard');
}
function showPage(name){
 const text={dashboard:'<h2>Dashboard</h2><p>Selamat datang di Admin Panel SIAP ASN.</p>',bank:'<h2>Bank Soal</h2><p>Kelola soal dari panel ini.</p>',tryout:'<h2>Tryout</h2><p>Kelola tryout dari panel ini.</p>',materi:'<h2>Materi</h2><p>Kelola materi dari panel ini.</p>',banner:'<h2>Banner</h2><p>Kelola banner dari panel ini.</p>'};
 $('page').innerHTML=text[name]||text.dashboard;
}
$('loginBtn').addEventListener('click',login);
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
sb.auth.getSession().then(r=>{if(r.data.session)openApp(r.data.session.user)});
</script></body></html>
