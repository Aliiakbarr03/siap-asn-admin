<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIAP ASN Admin</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
body{margin:0;font-family:Arial;background:#07152c;color:white}.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.box{width:360px;max-width:90%;background:#10284a;padding:30px;border-radius:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:10px;border:0;font-size:16px}button{background:#2196f3;color:white;font-weight:bold;cursor:pointer}.hidden{display:none}.top{padding:20px;background:#10284a}.content{padding:40px}
</style>
</head>
<body>
<div id="loginView" class="login">
<div class="box">
<h1>SIAP ASN</h1>
<h2>Admin Panel</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" type="button">MASUK ADMIN</button>
<p id="message"></p>
</div>
</div>
<div id="appView" class="hidden">
<div class="top"><b>SIAP ASN ADMIN</b> | <span id="userEmail"></span> <button id="logoutBtn" type="button" style="width:auto;margin-left:20px">Keluar</button></div>
<div class="content"><h1>Dashboard Admin</h1><p>Login berhasil. Admin Panel aktif.</p></div>
</div>
<script>
var SUPABASE_URL = 'https://qinxnrcdsmxduhvrnzfh.supabase.co';
var SUPABASE_KEY = 'sb_publishable__o_Qj-DptS7XEcYyi9CrSQ_pY3E5RSX';
var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('loginBtn').addEventListener('click', function () {
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  var message = document.getElementById('message');
  message.textContent = 'Memproses login...';

  client.auth.signInWithPassword({
    email: email,
    password: password
  }).then(function (result) {
    if (result.error) {
      message.textContent = result.error.message;
      return;
    }
    document.getElementById('loginView').className = 'hidden';
    document.getElementById('appView').className = '';
    document.getElementById('userEmail').textContent = result.data.user.email;
  }).catch(function (error) {
    message.textContent = error.message;
  });
});

document.getElementById('logoutBtn').addEventListener('click', function () {
  client.auth.signOut().then(function () {
    location.reload();
  });
});
</script>
</body>
</html>
